<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图谱 · IMAGE SONATA</title>
<link rel="stylesheet" href="src/css/app.css">
</head>
<body>
<div id="glow"></div>

<div class="shell">
  <header>
    <div class="brand">图谱<small>IMAGE SONATA</small></div>
    <button id="play" class="primary">▶ 播放</button>
    <button id="export" disabled>导出 WAV</button>
    <button id="vocal" class="on">人声 · 开</button>
    <div class="spacer"></div>
    <button id="pick">载入照片</button>
    <input id="file" type="file" accept="image/*" hidden>
  </header>

  <main>
    <div class="col left">
      <div class="card">
        <h3>照片</h3>
        <div class="frame" id="frame">
          <img id="preview" alt="">
          <div class="empty" id="emptyHint"><b>拖入一张照片</b>或点击选择 · 也可以试试下面的示例</div>
        </div>
        <div class="palette" id="palette"></div>
      </div>

      <div class="card">
        <h3>画面特征</h3>
        <div class="feat" id="feat"></div>
      </div>
    </div>

    <div class="col right">
      <div class="card">
        <h3>生成参数</h3>
        <div class="params" id="params"><div class="ph">载入照片后，这里会显示它决定的调性与速度</div></div>
      </div>

      <div class="card">
        <h3>为什么这样写</h3>
        <div class="why" id="why"><div class="ph">每条参数的来源都会写在这里</div></div>
      </div>
    </div>
  </main>

  <div class="stage">
    <canvas id="viz"></canvas>
    <div class="now" id="now">等待照片</div>
    <div class="clock" id="clock">0:00</div>
  </div>

  <footer>
    <div class="samples" id="samples"></div>
    <div class="hint">一次生成约 1 分半的完整小曲 · 同图同声 · 不调用模型、不播放预存音频</div>
  </footer>
</div>

<!-- 脚本必须按顺序加载：后一个文件依赖前一个文件的顶层声明。
     全部是普通 <script>（非 module），因此 file:// 双击即可运行。 -->
  <script src="src/js/util.js"></script>
  <script src="src/js/analysis.js"></script>
  <script src="src/js/mapping.js"></script>
  <script src="src/js/score.js"></script>
  <script src="assets/voicebank.js"></script>
  <script src="src/js/voxsample.js"></script>
  <script src="src/js/audio.js"></script>
  <script src="src/js/player.js"></script>
  <script src="src/js/viz.js"></script>
  <script src="src/js/export.js"></script>
  <script src="src/js/ui.js"></script>
  <script src="src/js/selftest.js"></script>
  <script src="src/js/main.js"></script>
</body>
</html>
